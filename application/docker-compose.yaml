services:
  mysql:
    image: mysql:8.0.45
    container_name: mysql-container-controle-de-corte
    env_file:
      - ./config/mysql.env
    ports:
      - "3306:3306"
    volumes:  
      - mysql-volume:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: always
    networks:
      - app-network  

  redis:
    image: redis:8.8
    container_name: redis-container-controle-de-corte
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    networks:
      - app-network

  backend-spring:    
    image: controle-de-corte-spring  
    build: ../Controle-de-Corte-La-Mayara/
    container_name: controle-de-corte-spring-container
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./config/backend.env
    networks:
      - app-network
  frontend-angular:
    image: controle-de-corte-angular
    build: ../controle-de-corte-angular/
    container_name: controle-de-corte-angular-container
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - backend-spring
    networks:
      - app-network

volumes:
  mysql-volume:
networks:
  app-network: